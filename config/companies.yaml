# Companies checked directly every run.
#
# Minimum entry:   - {name: Acme Corp, website: acme.com}
# The tool finds the careers page and job board on its own (cached in data/boards.json).
# If it can't, add `careers:` with the job-board URL, or pin the board exactly:
#   ats: workday     host: acme.wd5.myworkdayjobs.com  tenant: acme  site: AcmeCareers
#   ats: greenhouse | lever | ashby | smartrecruiters | bamboohr | recruitee | breezy | workable   slug: <board slug>
#   ats: ukg         board: https://recruiting.ultipro.com/<TENANT>/JobBoard/<guid>
#   ats: paylocity   guid: <guid>          ats: adp   cid: <guid>
#   ats: phenom      base: https://careers.acme.com/us/en
#   ats: jibe        origin: https://careers.acme.com
#   ats: icims       host: careers-acme.icims.com
#   ats: page        url: <any careers page>   (generic scan for "intern" links/text)
#
# Groups: anything outside `chicago_and_national` is treated as a local employer
# (a bare "Intern" posting or one with no location is still shown).

