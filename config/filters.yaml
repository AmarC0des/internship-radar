# What counts as a match. Edit freely: the next run picks it up.
# All matching is case-insensitive and on whole words.

# A posting must look like an internship / co-op.
internship_terms:
  - intern
  - interns
  - internship
  - co-op
  - coop
  - summer analyst
  - summer associate
  - student worker
  - student associate
  - student assistant
  - student intern

# Titles containing any of these are dropped even if they say "intern".
exclude_terms:
  - internal
  - international
  - internist
  - nurse
  - nursing
  - rn
  - cna
  - pharmacy
  - pharmacist
  - physician
  - medical intern
  - clinical
  - physical therapy
  - occupational therapy
  - dietetic
  - veterinary
  - high school
  - teacher
  - teaching
  - ministry
  - chaplain
  - culinary
  - landscaping
  - lifeguard
  - welding
  - welder
  - machinist
  - tool and die
  - tool & die
  - diesel
  - automotive technician
  - phd
  - ph.d
  - postdoc
  - mba

# Fields we care about. A title (or category text) hitting any term gets that tag.
# Jobs with no tag are dropped — except a bare "Intern"/"Summer Intern" at a local
# company, which is kept and tagged "General" because it's worth a look.
