function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const q=$("q").value.toLowerCase(),r=$("region").value,c=$("cat").value,n=$("onlynew").checked,l=$("localonly").checked;
