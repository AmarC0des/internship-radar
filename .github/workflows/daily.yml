name: Internship Radar

on:
  schedule:
    - cron: "17 11 * * *"   # every day ~6:17 AM Eastern (11:17 UTC)
  workflow_dispatch:
    inputs:
      redetect:
        description: "Re-find every company's job board (ignores cache)"
        type: boolean
        default: false
      no_email:
        description: "Skip the email this run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ARGS=""
          if [ "${{ inputs.redetect }}" = "true" ]; then ARGS="$ARGS --redetect"; fi
          if [ "${{ inputs.no_email }}" = "true" ]; then ARGS="$ARGS --no-email"; fi
          python -m radar.main $ARGS

      - name: Save results
        if: always()
        run: |
          git config user.name "internship-radar"
          git config user.email "internship-radar@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "radar: $(date -u +%Y-%m-%d)"
          git push
